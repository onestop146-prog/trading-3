# Runs the offline test suite whenever code changes (no API keys needed).
name: Tests

on:
  push:
    paths: ["bot/**", "tests/**", "requirements.txt"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
