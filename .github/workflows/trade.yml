# Runs the paper trading bot.
#  - Every 15 minutes on weekdays during US market hours (the times below are
#    UTC and cover 9:30-4:00 New York time in both summer and winter).
#    Runs land 2 minutes after each 15-minute bar closes.
#  - Every hour, all week: BTC trades 24/7. If the stock market is open the
#    hourly run skips itself, because the 15-minute run already covers it.
#  - Holidays and early closes are handled by asking Alpaca's market clock.
name: Trade

on:
  schedule:
    - cron: "2,17,32,47 13-20 * * 1-5"
    - cron: "7 * * * *"
  workflow_dispatch: {}   # lets you start a run by hand from the Actions tab

permissions:
  contents: write         # needed to save trades.csv etc. back to the repo

concurrency:
  group: bot-data         # never two runs at once (protects against duplicate orders)
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run the bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TRADING_PAUSED: ${{ vars.TRADING_PAUSED }}
        run: |
          if [ "${{ github.event.schedule }}" = "7 * * * *" ]; then
            python -m bot.live hourly
          else
            python -m bot.live
          fi

      - name: Save results to the repo
        if: always()
        run: scripts/commit_data.sh "Trade run"
